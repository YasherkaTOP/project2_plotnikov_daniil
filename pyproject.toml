[project]
name = "project2-plotnikov-daniil"
version = "1.0.0"
description = "Примитивная консольная база данных на Python с поддержкой таблиц и CRUD-операций"
authors = [
    {name = "Daniil",email = "yasherkindanone@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "prompt (>=0.4.1,<0.5.0)",
    "prettytable (>=3.18.0,<4.0.0)"
]

[project.scripts]
database = "src.primitive_db.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "src" },
]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.8,<0.17.0"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []
